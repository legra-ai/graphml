[package]
name = "graphml"
version = "0.1.1"
description = "Streaming GraphML parser producing owned property-graph nodes and edges, with optional Tokio async reading"
authors = ["DataRoad Inc, Delaware, USA, trading as Legra"]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/graphml"
readme = "README.md"
repository = "https://github.com/legra-ai/graphml"
keywords = ["graphml", "xml", "property-graph", "parser", "streaming"]
categories = ["parsing", "data-structures"]
publish = true
build = "build.rs"
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
    "build.rs",
    "tests/**/*.rs",
]

[lib]
doctest = true

[dependencies]
property-graph-model = { version = "0.1", optional = true }
quick-xml = "0.42"
thiserror = "2.0"
tokio = { version = "1", features = ["io-util"], optional = true }

[features]
# Conversions from this crate's parsed records into the format-neutral
# `property-graph-model` records used by streaming property-graph pipelines.
property-graph-model = ["dep:property-graph-model"]
# `AsyncGraphmlReader` over any `tokio::io::AsyncBufRead`.
tokio = ["dep:tokio", "quick-xml/async-tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[build-dependencies]
rhusky = "0.0.6"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# "GraphML" is a proper noun, not an identifier.
doc_markdown = "allow"
# The pedantic `large_futures` lint ICEs current nightly rustc on the
# async reader's opaque future ("unexpected rigid alias in layout_of").
large_futures = "allow"
